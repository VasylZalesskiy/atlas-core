<!doctype html><html lang="uk"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#f7f7f2"/><title>Atlas 2</title><link rel="stylesheet" href="./style.css"></head><body><main class="app"><header><div class="brand">ATLAS <span>2</span></div><button class="bell" aria-label="Сповіщення">○</button></header><section class="hero"><p class="eyebrow">Люди • можливості • рішення</p><h1>Яку задачу<br>потрібно вирішити?</h1><p class="sub">Опиши своїми словами або просто надиктуй. Atlas спробує знайти людей і можливості, які допоможуть.</p><div class="composer"><textarea id="task" rows="4" placeholder="Наприклад: мені потрібно відремонтувати компʼютер..."></textarea><div class="actions"><button id="mic" class="mic" aria-label="Надиктувати">🎙️ <span>Надиктувати</span></button><button id="find" class="find">Знайти рішення →</button></div></div><p id="status" class="status"></p></section><section class="quick"><h2>Що ще можна зробити?</h2><div class="cards"><button data-action="Можливість"><b>＋</b><span><strong>Додати можливість</strong><small>Що я маю або можу</small></span></button><button data-action="Потреба"><b>◎</b><span><strong>Оголосити потребу</strong><small>Що мені потрібно</small></span></button><button data-action="Мрія"><b>☆</b><span><strong>Додати мрію</strong><small>До чого я прагну</small></span></button></div></section><p class="motto">Твої можливості — частинка чиєїсь задачі.</p></main><nav><button class="active">⌂<span>Задачі</span></button><button>◇<span>Можливості</span></button><button>◎<span>Потреби</span></button><button>☆<span>Мрії</span></button><button>○<span>Я</span></button></nav><script src="./app.js"></script></body></html>
