name: Atlas GitHub Pages Preview

on:
  push:
    branches:
      - redesign/simple-page-2026-09-27

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Atlas
        env:
          VITE_SUPABASE_URL: https://ovrzxvqmipuitljzhpzs.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_hGHpg4N9qvjz371eAWLTYA_IXAh8R7z
        run: npm run build -- --base=/atlas-core/

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
